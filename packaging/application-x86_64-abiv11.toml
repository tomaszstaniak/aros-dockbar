# Source for the application.json shipped inside the Dockbar drawer.
id = "dockbar"
revision = 2
arch = "x86_64"
abi = "v11"

[launch]
executable = "Dockbar"
mode = "workbench"

[[requires_system]]
type = "library"
id = "crt.library"

[[requires_system]]
type = "library"
id = "stdlib.library"

[[requires_system]]
type = "library"
id = "m.library"

[[requires_system]]
type = "library"
id = "muimaster.library"

[[requires_system]]
type = "library"
id = "cybergraphics.library"
